[project]
name = "know-one"
version = "0.1.0"
description = "统一入库与检索能力的知识库业务模块"
requires-python = ">=3.12"
dependencies = [
    "jieba==0.42.1",             # 中文全文检索的应用侧固定分词器
    "psycopg[binary]>=3.2",       # PostgreSQL 驱动（worker 批量场景用同步接口）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.package-data]
"know_one.storage" = ["schema.sql", "migrations/*.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["know_one*"]

# 文本层 PDF 解析依赖外部 poppler 工具（pdftotext）：
#   macOS: brew install poppler
# KnowOne 固定用 -raw 恢复阅读顺序；不引入 Python PDF 解析重依赖，
# 扫描件、复杂表格和坐标级引用另行评估。
